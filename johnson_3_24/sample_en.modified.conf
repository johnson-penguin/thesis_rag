
###################################################################
# OAI gNodeB configuration file

Active_gNBs = ( "gNB-OAI");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID    = 0xe01;             // gNB identifier (customizable), used to uniquely identify this gNB. This example uses 0xE01.
    gNB_name  = "gNB-OAI";         // gNB name for identification only, has no protocol function.

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;        // TAC (Tracking Area Code), used by core network to identify areas (similar to LAC).

    plmn_list = ({ mcc = 001 ;mnc = 01 mnc_length = 2 snssaiList = ( { sst = 1 })})
    # Mobile Country Code, here 001 (test purpose).
    # Mobile Network Code, here 01.
    # MNC length is 2 digits (some MNCs use 3 digits).
    # snssaiList: Single Network Slice Selection Assistance Information, SST=1 indicates eMBB service type.

    nr_cellid = 1;  // NR Cell ID, used to distinguish gNB cells.

    ////////// Physical parameters:
    pdsch_AntennaPorts_XP = 2;     // Number of antenna ports used for PDSCH (downlink shared channel), here 2.
    pusch_AntennaPorts    = 2;     // Number of antenna ports used for PUSCH (uplink shared channel), also 2.
    do_CSIRS              = 1;     // Enable CSI-RS (Channel State Information Reference Signal), 1 means enabled.
    do_SRS                = 0;     // Enable SRS (Sounding Reference Signal), 0 means disabled.
    force_256qam_off      = 1;     // Force disable 256QAM (high-order modulation), 1 means disabled, only up to 64QAM.
    sib1_tda              = 15;    // Time Domain Allocation for SIB1, setting 15 indicates a specific time domain index.


    pdcch_ConfigSIB1 = (
      {
        controlResourceSetZero = 11; // CORESET#0 configuration index, affects PDCCH resource range.
        searchSpaceZero = 0; // SearchSpace#0 configuration index, affects where UE receives PDCCH.
      }
    );

    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                                    = 0;
     # n_TimingAdvanceOffset                                         = 0;
#  downlinkConfigCommon
    #frequencyInfoDL
      # this is 3450.72 MHz (center frequency)
      absoluteFrequencySSB                                          = 630048;
      dl_frequencyBand                                              = 78;
      # this is 3401.58 MHz
      dl_absoluteFrequencyPointA                                    = 626772;
      #scs-SpecificCarrierList
        dl_offstToCarrier                                           = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing                                        = 1;
        dl_carrierBandwidth                                         = 273;
     #initialDownlinkBWP
      #genericParameters
       initialDLBWPlocationAndBandwidth                             = 1099; #38.101-1 Table 5.3.2-1
       #
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialDLBWPsubcarrierSpacing                               = 1;
      #pdcch-ConfigCommon
        initialDLBWPcontrolResourceSetZero                          = 11;
        initialDLBWPsearchSpaceZero                                 = 0;

  #uplinkConfigCommon
     #frequencyInfoUL
      ul_frequencyBand                                              = 78;
      #scs-SpecificCarrierList
      ul_offstToCarrier                                             = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 273;
      pMax                                                          = 23;
     #initialUplinkBWP
      #genericParameters
        initialULBWPlocationAndBandwidth                            = 1099;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialULBWPsubcarrierSpacing                               = 1;
      #rach-ConfigCommon
        #rach-ConfigGeneric
          prach_ConfigurationIndex                                  = 151;
#prach_msg1_FDM
#0 = one, 1=two, 2=four, 3=eight
          prach_msg1_FDM                                            = 0;
          prach_msg1_FrequencyStart                                 = 0;
          zeroCorrelationZoneConfig                                 = 0;
          preambleReceivedTargetPower                               = -100;
#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
          preambleTransMax                                          = 7;
#powerRampingStep
# 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep                                            = 3;
#ra_ReponseWindow
#1,2,4,8,10,20,40,80
        ra_ResponseWindow                                           = 5;
#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 3;
#oneHalf (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;
#ra_ContentionResolutionTimer
#(0..7) 8,16,24,32,40,48,56,64
        ra_ContentionResolutionTimer                                = 7;
        rsrp_ThresholdSSB                                           = 19;
#prach-RootSequenceIndex_PR
#1 = 839, 2 = 139
        prach_RootSequenceIndex_PR                                  = 2;
        prach_RootSequenceIndex                                     = 1;
        # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
        #
        msg1_SubcarrierSpacing                                      = 1,
# restrictedSetConfig
# 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig                                         = 0,

# this is the offset between the last PRACH preamble power and the Msg3 PUSCH, 2 times the field value in dB
        msg3_DeltaPreamble                                          = 2;
        p0_NominalWithGrant                                         = -96;

# pucch-ConfigCommon setup :
# pucchGroupHopping
# 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping                                           = 0;
        hoppingId                                                   = 0;
        p0_nominal                                                  = -96;
# ssb_PositionsInBurs_BitmapPR
# 1=short, 2=medium, 3=long
      ssb_PositionsInBurst_PR                                       = 2;
      ssb_PositionsInBurst_Bitmap                                   = 0x1;

# ssb_periodicityServingCell
# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
      ssb_periodicityServingCell                                    = 2;

# dmrs_TypeA_position
# 0 = pos2, 1 = pos3
      dmrs_TypeA_Position                                           = 0;

# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      subcarrierSpacing                                             = 1;


  #tdd-UL-DL-ConfigurationCommon
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      referenceSubcarrierSpacing                                    = 1;
      # pattern1
      # dl_UL_TransmissionPeriodicity
      # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;

  ssPBCH_BlockPower                                                 = 10;
  }

  );


    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2; // Number of SCTP input streams, used for receiving data from AMF.
        SCTP_OUTSTREAMS = 2; // Number of SCTP output streams, used for sending data to AMF.
    };

    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "10.0.0.1" }); // AMF IP address

    NETWORK_INTERFACES :
    {
    GNB_IPV4_ADDRESS_FOR_NG_AMF  = "192.168.8.43"; // gNB IP for connecting to AMF (N2 interface, signaling plane).
    GNB_IPV4_ADDRESS_FOR_NGU     = "192.168.8.43"; // gNB IP for user data transmission (N3 interface, data plane).
    GNB_PORT_FOR_S1U             = 2152;           // gNB S1-U port, default 2152 (standard GTP-U port).
    };
  }
);




MACRLCs = (
{
  num_cc = 1;                      // Number of supported Component Carriers (here only 1).
  tr_s_preference = "local_L1";    // Preferred transport channel between MAC and L1 (PHY), using local IPC.
  tr_n_preference = "local_RRC";   // Preferred transport channel between MAC and RRC, using local IPC.
  pusch_TargetSNRx10 = 300;        // Target uplink PUSCH SNR multiplied by 10 (actual 30 dB).
  pucch_TargetSNRx10 = 230;        // Target uplink PUCCH (control channel) SNR (actual 23 dB).
  dl_bler_target_upper = .35;      // Downlink BLER upper threshold. Exceeding triggers MCS adjustment.
  dl_bler_target_lower = .15;      // Downlink BLER lower threshold. Below this may increase MCS.
  ul_bler_target_upper = .35;      // Uplink BLER upper threshold.
  ul_bler_target_lower = .15;      // Uplink BLER lower threshold.
  pusch_FailureThres = 100;        // Threshold for consecutive PUSCH uplink failures before triggering retransmission or disconnection.
  ul_max_mcs = 28;                 // Maximum allowed uplink MCS level (28 means 64QAM supported).
}
);



L1s = (
{
  num_cc = 1;                              // Number of supported Component Carriers (single carrier).
  tr_n_preference = "local_mac";           // Preferred transport channel between L1 and MAC, using local IPC.
  prach_dtx_threshold = 130;               // PRACH DTX threshold in subframes. UE not responding beyond this is considered failed RA.
  pucch0_dtx_threshold = 80;               // PUCCH format 0 DTX threshold. UE without uplink control signal beyond this is considered lost.
  pusch_dtx_threshold = 10;                // PUSCH DTX threshold, possibly in TTI.
  max_ldpc_iterations = 10;                // Max LDPC decoding iterations. Higher is more accurate but computationally intensive.
  tx_amp_backoff_dB = 20;                  // TX power backoff in dB to protect PA and match O-RU settings. Must align with O-RU.
  L1_rx_thread_core = 8;                   // CPU core binding for PHY RX thread (here core 8).
  L1_tx_thread_core = 10;                  // CPU core binding for PHY TX thread (here core 10). Reduces context switching and improves performance.
  phase_compensation = 0;                  // Phase compensation toggle. 0 means disabled. Must align with O-RU. If enabled, gNB compensates using O-RU feedback.
}
);








RUs = (
{
  local_rf       = "no";
  nb_tx          = 2; # 4
  nb_rx          = 2; # 4
  att_tx         = 0; # TODO relevant?
  att_rx         = 0; # TODO relevant?
  bands          = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75; # TODO relevant?
  sf_extension                  = 0; # TODO relevant?
  eNB_instances  = [0]; # TODO is relevant?
  ru_thread_core = 6;
  sl_ahead       = 5;
  ##beamforming 1x2 matrix: 1 layer x 2 antennas
  bf_weights = [0x00007fff, 0x0000,0x00007fff, 0x0000]; # necessary?

  tr_preference  = "raw_if4p5"; # important: activate FHI7.2
  do_precoding = 0; # needs to match O-RU configuration
  
}
);

security = {
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms = ( "nea0" );

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms = ( "nia2", "nia0" );

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level                      ="info";
  hw_log_level                          ="debug";
  phy_log_level                         ="info";
  mac_log_level                         ="info";
  rlc_log_level                         ="info";
  pdcp_log_level                        ="info";
  rrc_log_level                         ="info";
  ngap_log_level                        ="info";
  f1ap_log_level                        ="info";
};


