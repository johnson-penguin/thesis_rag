
###################################################################
# OAI gNodeB configuration file

Active_gNBs = ( "gNB-OAI");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID    = 0xe01;             // gNB 的識別碼（可自訂），用於唯一標識該 gNB。此為 0xE01。
    gNB_name  = "gNB-OAI";         // gNB 的名稱，純粹識別用，無實際協定功能。

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;        // TAC (Tracking Area Code)，用於核心網路識別區域（類似 LAC）。

    plmn_list = ({ mcc = 001 ;mnc = 01 mnc_length = 2 snssaiList = ( { sst = 1 })})
    # Mobile Country Code（行動國家碼），這裡為 001（測試用）。
    # Mobile Network Code（行動網路碼），這裡為 01。
    # MNC 的長度為 2 碼（有些 MNC 為 3 碼）。
    # snssaiList : Single Network Slice Selection Assistance Information，SST=1 表示 eMBB 服務類型。
 

    nr_cellid = 1;  // NR 小區識別碼（Cell ID），用於區分不同 gNB 小區。

    ////////// Physical parameters:
    pdsch_AntennaPorts_XP = 2;     // PDSCH（下行共享通道）使用的天線端口數，這裡為 2。
    pusch_AntennaPorts    = 2;     // PUSCH（上行共享通道）使用的天線端口數，這裡也為 2。
    do_CSIRS              = 1;     // 是否啟用 CSI-RS（Channel State Information Reference Signal），1 為啟用。
    do_SRS                = 0;     // 是否啟用 SRS（Sounding Reference Signal），0 為不啟用。
    force_256qam_off      = 1;     // 是否強制關閉 256QAM（高階調變），1 為關閉，僅允許到 64QAM。
    sib1_tda              = 15;    // SIB1 的傳送時間對應（Time Domain Allocation），設定 15 表示對應時域配置索引。


    pdcch_ConfigSIB1 = (
      {
        controlResourceSetZero = 11; // CORESET#0 的配置索引，影響 PDCCH 的資源範圍。
        searchSpaceZero = 0; // SearchSpace#0 的配置索引，影響 UE 在那裡接收 PDCCH。
      }
    );

    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                                    = 0;   // 物理小區識別碼，範圍 0~1007，用於標識此小區
     # n_TimingAdvanceOffset                                         = 0;  // 時間提前量的偏移，通常不手動設定
#  downlinkConfigCommon
    #frequencyInfoDL
      # this is 3450.72 MHz (center frequency)
      absoluteFrequencySSB                                          = 630048; // SSB 的中心頻率，對應約 3450.72 MHz（見 TS 38.104 Table 5.4.2.1-1）
      dl_frequencyBand                                              = 78;  // 頻段編號，n78 表示 3.3GHz~3.8GHz
      # this is 3401.58 MHz
      dl_absoluteFrequencyPointA                                    = 626772; // 頻點 A 的絕對頻率，對應約 3401.58 MHz
      #scs-SpecificCarrierList
        dl_offstToCarrier                                           = 0; // 頻率偏移，對應於 Point A
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing                                        = 1; // 下行子載波間距為 30kHz
        dl_carrierBandwidth                                         = 273; // 下行頻寬（273 個 Resource Blocks）
     #initialDownlinkBWP
      #genericParameters
       initialDLBWPlocationAndBandwidth                             = 1099; #38.101-1 Table 5.3.2-1 // 初始 BWP 的位置與頻寬設定（參見 TS 38.101-1 Table 5.3.2-1）
       #
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialDLBWPsubcarrierSpacing                               = 1; // 初始 DL BWP 的子載波間距為 30kHz

      #pdcch-ConfigCommon
        initialDLBWPcontrolResourceSetZero                          = 11; // ControlResourceSet ID
        initialDLBWPsearchSpaceZero                                 = 0;  // SearchSpace ID

  #uplinkConfigCommon
     #frequencyInfoUL
      ul_frequencyBand                                              = 78; // 上行頻段與下行相同，為 n78
      #scs-SpecificCarrierList
      ul_offstToCarrier                                             = 0; // 上行與下行共用頻段時，offset 為 0
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      ul_subcarrierSpacing                                          = 1; // 上行子載波間距 30kHz
      ul_carrierBandwidth                                           = 273; // 上行頻寬為 273 RBs
      pMax                                                          = 23; // UE 最大發射功率（dBm）
     #initialUplinkBWP
      #genericParameters
        initialULBWPlocationAndBandwidth                            = 1099; // 上行初始 BWP 頻寬與位置
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialULBWPsubcarrierSpacing                               = 1; // 上行子載波間距為 30kHz
      #rach-ConfigCommon
        #rach-ConfigGeneric
          prach_ConfigurationIndex                                  = 151; // PRACH 配置索引（TS 38.211 Table 6.3.3.2-2）
#prach_msg1_FDM
#0 = one, 1=two, 2=four, 3=eight
          prach_msg1_FDM                                            = 0; // Msg1 所用的 FDM 數量，0=1 個頻寬單位
          prach_msg1_FrequencyStart                                 = 0; // Msg1 的起始頻率位置
          zeroCorrelationZoneConfig                                 = 0; // ZCZ 配置，影響 PRACH 的序列選擇
          preambleReceivedTargetPower                               = -100; // Preamble 的目標接收功率（dBm）
#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
          preambleTransMax                                          = 7; // Preamble 最大傳送次數（此為 20 次）
#powerRampingStep
# 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep                                            = 3;  // 功率遞增步進（此為 6dB）
#ra_ReponseWindow
#1,2,4,8,10,20,40,80
        ra_ResponseWindow                                           = 5; // 隨機接入回應窗口（此為 20 個 slot）
#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 3; // 每個 SSB 的 contention-based preamble 比例（此為一半）
#oneHalf (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15; // 每個 SSB 可使用的 preamble 數量
#ra_ContentionResolutionTimer
#(0..7) 8,16,24,32,40,48,56,64
        ra_ContentionResolutionTimer                                = 7;  // 爭用解決計時器（此為 64ms）
        rsrp_ThresholdSSB                                           = 19; // 用於觸發隨機接入的 SSB RSRP 閾值（單位 dBm）
#prach-RootSequenceIndex_PR
#1 = 839, 2 = 139
        prach_RootSequenceIndex_PR                                  = 2; // 根序列索引型別，2 表示使用長序列（139）
        prach_RootSequenceIndex                                     = 1; // PRACH 的根序列索引
        # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
        #
        msg1_SubcarrierSpacing                                      = 1,
# restrictedSetConfig
# 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig                                         = 0,

# this is the offset between the last PRACH preamble power and the Msg3 PUSCH, 2 times the field value in dB
        msg3_DeltaPreamble                                          = 2; // Msg3 相對 preamble 功率的 offset（乘以 2，表示 4 dB）
        p0_NominalWithGrant                                         = -96; // 有 grant 時的 PUSCH 初始功率

# pucch-ConfigCommon setup :
# pucchGroupHopping
# 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping                                           = 0; // 不使用 PUCCH group hopping
        hoppingId                                                   = 0; // hopping ID
        p0_nominal                                                  = -96; // PUCCH 初始功率
# ssb_PositionsInBurs_BitmapPR
# 1=short, 2=medium, 3=long
      ssb_PositionsInBurst_PR                                       = 2; // SSB 位置類型，2=medium
      ssb_PositionsInBurst_Bitmap                                   = 0x1; // bitmap 指定 SSB 的位置（第 0 個位置啟用）

# ssb_periodicityServingCell
# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
      ssb_periodicityServingCell                                    = 2; // SSB 週期，2 表示 20ms

# dmrs_TypeA_position
# 0 = pos2, 1 = pos3
      dmrs_TypeA_Position                                           = 0; // DMRS 類型 A 的位置，0=pos2

# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      subcarrierSpacing                                             = 1; // 整體子載波間距為 30kHz


  #tdd-UL-DL-ConfigurationCommon
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      referenceSubcarrierSpacing                                    = 1; // TDD 配置參考的 SCS 為 30kHz
      # pattern1
      # dl_UL_TransmissionPeriodicity
      # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
      dl_UL_TransmissionPeriodicity                                 = 6;  // TDD 周期為 5ms
      nrofDownlinkSlots                                             = 7;  // 每個週期中的下行 slot 數
      nrofDownlinkSymbols                                           = 6;  // 下行部分的 OFDM symbol 數（最後一 slot 為部分 DL）
      nrofUplinkSlots                                               = 2;  // 每個週期中的上行 slot 數
      nrofUplinkSymbols                                             = 4;  // 上行部分的 OFDM symbol 數（第一個 UL slot 為部分 UL）

  ssPBCH_BlockPower                                                 = 10; // SS/PBCH 區塊的發射功率（dBm）
  }

  );


    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2; // SCTP 輸入流的數量，用於處理 AMF 傳入的資料。
        SCTP_OUTSTREAMS = 2; // SCTP 輸出流的數量，用於傳送資料給 AMF。
    };


    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "192.168.8.21" }); // AMF 的 IP 位址


    NETWORK_INTERFACES :
    {
    GNB_IPV4_ADDRESS_FOR_NG_AMF  = "192.168.8.43"; // gNB 用來與 AMF 連線的 IP（即 N2 介面，訊號平面）。
    GNB_IPV4_ADDRESS_FOR_NGU     = "192.168.8.43"; // gNB 用來傳輸使用者數據的 IP（即 N3 介面，數據平面）。
    GNB_PORT_FOR_S1U             = 2152;           // gNB 的 S1-U 埠口，預設為 2152（標準 GTP-U port）。
    };

  }
);




MACRLCs = (
{
  num_cc = 1;                      // 支援的 Component Carrier 數量（這裡只開啟 1 條載波）。
  tr_s_preference = "local_L1";    // MAC 層與 L1（PHY）之間的傳輸通道偏好設定，使用 local IPC。
  tr_n_preference = "local_RRC";   // MAC 層與 RRC 之間的傳輸通道偏好設定，使用 local IPC。
  pusch_TargetSNRx10 = 300;        // 上行 PUSCH 目標 SNR，乘以 10（實際值為 30 dB）。
  pucch_TargetSNRx10 = 230;        // 上行 PUCCH（控制通道）目標 SNR，實際為 23 dB。
  dl_bler_target_upper = .35;      // 下行 Block Error Rate(BLR) 上限，超過此值則需調整  Modulation and Coding Scheme (MCS) 。
  dl_bler_target_lower = .15;      // 下行 Block Error Rate(BLR) 下限，低於此值則可能提升  Modulation and Coding Scheme (MCS) 。
  ul_bler_target_upper = .35;      // 上行 Block Error Rate(BLR) 上限。
  ul_bler_target_lower = .15;      // 上行 Block Error Rate(BLR) 下限。
  pusch_FailureThres = 100;        // 若上行 PUSCH 連續失敗達此門檻，可能觸發重傳或掉線處理。
  ul_max_mcs = 28;                 // 上行允許的最高 MCS 級別（28 表示支援 64QAM）。
}
);



L1s = (
{
  num_cc = 1;                              // 支援的 Component Carrier 數量（這裡為單載波）。
  tr_n_preference = "local_mac";           // L1 層與 MAC 之間的傳輸通道偏好設定，使用 local IPC。
  prach_dtx_threshold = 130;               // PRACH 的 DTX（Discontinuous Transmission）門檻，單位為子幀數。若 UE 超過此時間無回應，gNB 會視為隨機接入失敗。
  pucch0_dtx_threshold = 80;               // PUCCH format 0 的 DTX 門檻，超過該門檻無上行控制訊號即視為 UE 失聯。
  pusch_dtx_threshold = 10;                // PUSCH（上行共享通道）DTX 門檻，單位可能為 TTI。
  max_ldpc_iterations = 10;                // LDPC（低密度奇偶校驗）最大解碼迭代次數，越高越準確，但計算成本也高。
  tx_amp_backoff_dB = 20;                  // 傳輸功率回退（dB），為保護 PA（功率放大器）與符合 O-RU 設定。 **需與 O-RU 設定對應一致**，否則可能導致信號過強或過弱。
  L1_rx_thread_core = 8;                   // 指定實體層接收執行緒綁定的 CPU core（這裡為 core 8）。
  L1_tx_thread_core = 10;                  // 指定實體層發送執行緒綁定的 CPU core（這裡為 core 10）。綁定可減少 context switch 提升效能。
  phase_compensation = 0;                  // 相位補償開關，0 表示關閉。此設定也需與 O-RU 一致。若開啟，gNB 會根據 O-RU 回報進行相位校正。
}
);








RUs = (
{
  local_rf       = "no";
  nb_tx          = 2; # 4
  nb_rx          = 2; # 4
  att_tx         = 0; # TODO relevant?
  att_rx         = 0; # TODO relevant?
  bands          = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 75; # TODO relevant?
  sf_extension                  = 0; # TODO relevant?
  eNB_instances  = [0]; # TODO is relevant?
  ru_thread_core = 6;
  sl_ahead       = 5;
  ##beamforming 1x2 matrix: 1 layer x 2 antennas
  bf_weights = [0x00007fff, 0x0000,0x00007fff, 0x0000]; # necessary?

  tr_preference  = "raw_if4p5"; # important: activate FHI7.2
  do_precoding = 0; # needs to match O-RU configuration
  
}
);

security = {
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms = ( "nea0" ); // 此處設定為 nea0，表示不啟用加密（明文傳輸）

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms = ( "nia2", "nia0" ); // 優先使用 AES 為完整性保護機制，若 UE 不支援則退回無保護（nia0）
  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering = "yes"; // 資料承載啟用加密（除非選到的是 nea0）
  drb_integrity = "no";  // 關閉資料承載的完整性保護（節省計算資源，但降低安全性）
};

log_config :
{
  global_log_level                      ="info";
  hw_log_level                          ="debug";
  phy_log_level                         ="info";
  mac_log_level                         ="info";
  rlc_log_level                         ="info";
  pdcp_log_level                        ="info";
  rrc_log_level                         ="info";
  ngap_log_level                        ="info";
  f1ap_log_level                        ="info";
};


fhi_72 = {
  dpdk_devices = ("0000:ca:02.0", "0000:ca:02.1");   // DPDK 網卡設備 PCI 位址，用於傳輸 DU <-> RU 的資料
  system_core = 0;   // 系統核心：用於主程序或控制流程綁定的核心 ID
  io_core = 4;  // IO 核心：用於處理網路 IO（例如收發封包）的核心 ID
  worker_cores = (2);  // 工作核心：處理資料平面的核心列表（可有多個）
  du_addr = ("00:11:22:33:44:66", "00:11:22:33:44:66");   // DU 的 MAC 位址（雙埠配置，支援雙向收發或多鏈路）
  ru_addr = ("10:70:fd:14:1c:10", "10:70:fd:14:1c:10");   // RU 的 MAC 位址（實體 RU 裝置的位址）
  mtu = 1500;   // 網路 MTU 設定，通常設定為 1500（標準乙太網幀大小）
  file_prefix = "fhi_72";   // 用於 DPDK 記憶體區域命名，避免多個實例重複


  # FrontHaul（FHI）時間參數設定區塊
  fh_config = ({

    Tadv_cp_dl = 125;    // 下行控制平面的提前時間（單位：ns）
    T2a_cp_dl = (259, 470);    // 下行控制平面 DU -> RU 傳送最大/最小延遲（單位：ns）
    T2a_cp_ul = (125, 1200);    // 上行控制平面 RU -> DU 傳送最大/最小延遲（單位：ns）
    T2a_up = (70, 345);    // 上行使用者平面 RU -> DU 傳送最大/最小延遲（單位：ns）
    Ta3 = (50, 171);    // DU 接收到資料到交給 L1 處理的時間範圍（單位：ns）
    T1a_cp_dl = (258, 392);    // 下行控制平面 DU 處理時間（DU 出發到 MAC 封包送出）範圍（ns）
    T1a_cp_ul = (285, 300);    // 上行控制平面 DU 處理時間（ns）
    T1a_up = (155, 300);    // 上行使用者平面 DU 處理時間（ns）
    Ta4 = (0, 200);    // RU 接收到資料後開始轉發的延遲（ns）

    ru_config = {
      iq_width = 9;           // IQ 資料寬度（9 bits，代表壓縮格式）
      iq_width_prach = 9;     // PRACH 使用的 IQ 資料寬度
      fft_size = 12;          // FFT 級數（log2(N)，N=2^12=4096；對應 273 RB）
    };
    # PRACH 設定區
    prach_config = {
      eAxC_offset = 2;  // eAxC 偏移值（指示 PRACH 資料從哪一條 eAxC 開始）
    };
  });
};